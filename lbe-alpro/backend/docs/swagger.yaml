basePath: /api/v1
definitions:
  dto.CreateEventRequest:
    properties:
      category:
        enum:
        - minat_bakat
        - kewirausahaan
        - manajerial
        - keilmiahan
        type: string
      deadline:
        type: string
      description:
        minLength: 10
        type: string
      end_date:
        type: string
      poster_url:
        type: string
      quota:
        minimum: 1
        type: integer
      start_date:
        type: string
      title:
        maxLength: 255
        minLength: 3
        type: string
      type:
        enum:
        - lomba
        - bootcamp
        - oprec
        - workshop
        - funmatch
        - bazar
        - riset
        type: string
    required:
    - category
    - deadline
    - description
    - quota
    - title
    - type
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.RegisterRequest:
    properties:
      department:
        maxLength: 100
        type: string
      email:
        type: string
      name:
        maxLength: 255
        minLength: 2
        type: string
      password:
        maxLength: 72
        minLength: 6
        type: string
    required:
    - email
    - name
    - password
    type: object
  dto.UpdateEventRequest:
    properties:
      category:
        enum:
        - minat_bakat
        - kewirausahaan
        - manajerial
        - keilmiahan
        type: string
      deadline:
        type: string
      description:
        minLength: 10
        type: string
      end_date:
        type: string
      poster_url:
        type: string
      quota:
        minimum: 1
        type: integer
      start_date:
        type: string
      title:
        maxLength: 255
        minLength: 3
        type: string
      type:
        enum:
        - lomba
        - bootcamp
        - oprec
        - workshop
        - funmatch
        - bazar
        - riset
        type: string
    type: object
  dto.UpdateProfileRequest:
    properties:
      bio:
        maxLength: 1000
        type: string
      department:
        maxLength: 100
        type: string
      name:
        maxLength: 255
        minLength: 2
        type: string
    type: object
  dto.UpdateRegistrationStatusRequest:
    properties:
      status:
        enum:
        - approved
        - rejected
        type: string
    required:
    - status
    type: object
host: localhost:8080
info:
  contact: {}
  description: Platform terpadu pengembangan diri mahasiswa ITS.
  title: SinergiITS API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate and receive a JWT token
      parameters:
      - description: Login payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      summary: Login
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new account with student role. Role is forced to student.
      parameters:
      - description: Registration payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
      summary: Register new student account
      tags:
      - auth
  /events:
    get:
      description: Get a paginated list of published events with optional filters
      parameters:
      - description: Filter by category
        in: query
        name: category
        type: string
      - description: Filter by event type
        in: query
        name: type
        type: string
      - description: Filter by status (open/closed)
        in: query
        name: status
        type: string
      - description: Search keyword
        in: query
        name: q
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: List published events
      tags:
      - events
    post:
      consumes:
      - application/json
      description: Create a new event (organizer/admin only). Status forced to pending.
      parameters:
      - description: Event payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.CreateEventRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create event
      tags:
      - events
  /events/{id}:
    delete:
      description: Delete an event (owner organizer/admin only)
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete event
      tags:
      - events
    get:
      description: Get a published event by ID
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Get event detail
      tags:
      - events
    put:
      consumes:
      - application/json
      description: Update an event (owner organizer/admin only)
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateEventRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update event
      tags:
      - events
  /events/{id}/register:
    post:
      description: Register the current user to an event (student only)
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Register to event
      tags:
      - registrations
  /events/{id}/registrants:
    get:
      description: Get all registrants for an event (owner organizer/admin only)
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List event registrants
      tags:
      - organizer
  /organizer/events:
    get:
      description: Get all events for the current organizer
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List organizer events
      tags:
      - organizer
  /registrations/{id}/status:
    put:
      consumes:
      - application/json
      description: Approve or reject a pending registration (organizer/admin only)
      parameters:
      - description: Registration ID
        in: path
        name: id
        required: true
        type: integer
      - description: Status update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateRegistrationStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update registration status
      tags:
      - registrations
  /registrations/me:
    get:
      description: Get all registrations for the current user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List my registrations
      tags:
      - registrations
  /users/me:
    get:
      description: Get the authenticated user's profile
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Update the authenticated user's profile
      parameters:
      - description: Update payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update current user profile
      tags:
      - users
schemes:
- http
securityDefinitions:
  BearerAuth:
    description: Masukkan "Bearer {token}"
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
